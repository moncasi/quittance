name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Serveur (test PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: server
        run: npm install
      - name: Test de génération PDF
        working-directory: server
        run: npm test

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: client
        run: npm install
      - name: Build
        working-directory: client
        run: npm run build
